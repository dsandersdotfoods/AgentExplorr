# =============================================================================
# LoRA Configuration for LLM Fine-Tuning
# =============================================================================
#
# This file configures the LoRA (Low-Rank Adaptation) fine-tuning process.
# Every parameter is explained with WHY it matters and WHAT values to try.
#
# USAGE:
#   from agentexplorr.llm_training.fine_tune_lora import LoRAFineTuner
#   tuner = LoRAFineTuner.from_yaml("configs/lora_config.yaml")
#
# TIP: Create multiple config files for different experiments:
#   lora_config_small.yaml   (r=8, quick experiments)
#   lora_config_medium.yaml  (r=16, balanced — THIS FILE)
#   lora_config_large.yaml   (r=64, maximum quality)
#
# LEARNING RESOURCES:
#   - LoRA paper: https://arxiv.org/abs/2106.09685
#   - PEFT docs: https://huggingface.co/docs/peft
#   - VIDEO: "LoRA Explained" (Umar Jamil):
#     https://www.youtube.com/watch?v=PXWYUTMt-AU
# =============================================================================


# =============================================================================
# MODEL SELECTION
# =============================================================================
# Which pre-trained model to fine-tune.
#
# RECOMMENDATIONS BY GPU MEMORY:
#   - 4 GB VRAM  : TinyLlama/TinyLlama-1.1B-Chat-v1.0  (use QLoRA)
#   - 8 GB VRAM  : TinyLlama (LoRA) or Mistral-7B (QLoRA)
#   - 16 GB VRAM : Mistral-7B (LoRA) or Llama-2-13B (QLoRA)
#   - 24 GB VRAM : Llama-2-13B (LoRA) or Llama-2-70B (QLoRA)
#   - 80 GB VRAM : Llama-2-70B (LoRA, full A100)
#
# TinyLlama is the default because it's PERFECT for learning:
#   - Small enough to train in minutes (not hours)
#   - Uses the same architecture as Llama 2 (skills transfer!)
#   - Free, no gated access required
base_model_name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"


# =============================================================================
# LoRA HYPERPARAMETERS
# =============================================================================
# These control the LoRA adapter architecture.
# The math: y = W*x + (alpha/r) * B*A*x
#   where W = frozen base weights, A and B = trainable LoRA matrices

# RANK (r): The dimensionality of the low-rank decomposition.
# This is the single most important LoRA hyperparameter.
#
# How it affects trainable parameters:
#   r=8  → ~2M trainable params (0.2% of TinyLlama)
#   r=16 → ~4M trainable params (0.4% of TinyLlama)  ← DEFAULT
#   r=32 → ~8M trainable params (0.7% of TinyLlama)
#   r=64 → ~16M trainable params (1.5% of TinyLlama)
#
# RULE OF THUMB: Start with r=16. If underfitting (val loss plateaus
# high), increase to 32 or 64. If overfitting, decrease to 8.
lora_r: 16

# ALPHA: Scaling factor for the LoRA update.
# Effective scaling = alpha / r.
#
# With r=16 and alpha=32: scaling = 2.0 (slightly aggressive)
# With r=16 and alpha=16: scaling = 1.0 (conservative)
#
# Higher alpha → model changes more per update → faster adaptation
# but potentially less stable training.
#
# COMMON PRACTICE: Set alpha = 2 * r for a good balance.
lora_alpha: 32

# DROPOUT: Regularization for LoRA layers.
# Randomly sets some LoRA activations to zero during training.
#
# 0.00 = No dropout (large datasets, no overfitting risk)
# 0.05 = Light dropout (medium datasets) ← DEFAULT
# 0.10 = Moderate dropout (small datasets, <1K examples)
# 0.20 = Heavy dropout (very small datasets or extreme overfitting)
lora_dropout: 0.05

# TARGET MODULES: Which layers to apply LoRA to.
#
# In a Transformer block:
#   Self-Attention:
#     q_proj — Query: "What am I looking for?"
#     k_proj — Key: "What do I contain?"
#     v_proj — Value: "What information do I carry?"
#     o_proj — Output projection: combines attention heads
#
#   MLP (Feed-Forward Network):
#     gate_proj — Gating mechanism (Llama/Mistral architecture)
#     up_proj — Projects to higher dimension
#     down_proj — Projects back to model dimension
#
# The original LoRA paper only used q_proj and v_proj.
# The QLoRA paper showed that applying to ALL linear layers is better.
# We follow the QLoRA recommendation.
#
# TRADE-OFF: More modules = more parameters = better quality but more memory.
# For quick experiments, try just: [q_proj, v_proj]
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj


# =============================================================================
# TRAINING HYPERPARAMETERS
# =============================================================================

# EPOCHS: Number of complete passes through the training data.
# 1 = model sees each example once (often underfitted)
# 3 = good starting point ← DEFAULT
# 5 = risk of overfitting on small datasets
#
# WATCH YOUR VALIDATION LOSS:
#   - Val loss still decreasing at epoch 3? Try 5 epochs.
#   - Val loss increasing at epoch 2? Try 1-2 epochs or more regularization.
num_train_epochs: 3

# BATCH SIZE: Examples processed per GPU per step.
# Larger = more stable gradients, faster training, but more VRAM.
#
# If you get CUDA OOM:
#   1. Reduce this to 2 or 1
#   2. Increase gradient_accumulation_steps to compensate
#   3. effective_batch_size = batch_size * gradient_accumulation_steps
per_device_train_batch_size: 4

# GRADIENT ACCUMULATION: Simulate larger batches without more VRAM.
# With batch_size=4 and accumulation=4: effective batch = 16.
#
# This is a MEMORY-SAVING TRICK. Instead of processing 16 examples
# at once (which might not fit in VRAM), we process 4 at a time,
# accumulate gradients 4 times, THEN update the weights.
#
# The model sees the same effective batch size either way.
gradient_accumulation_steps: 4

# LEARNING RATE: How big each weight update step is.
# THE most important training hyperparameter.
#
# Too high (>1e-3) → unstable training, loss oscillates/diverges
# Too low  (<1e-5) → painfully slow, model barely changes
# Sweet spot: 1e-4 to 3e-4 for LoRA fine-tuning
#
# EXPLORATION STRATEGY:
#   1. Start with 2e-4 (this default)
#   2. If loss decreases smoothly → you're good
#   3. If loss oscillates → try 1e-4 (halve it)
#   4. If loss barely moves → try 5e-4 (increase it)
learning_rate: 2.0e-4

# WARMUP: Fraction of training steps with linearly increasing LR.
# Learning rate goes from 0 → learning_rate over this fraction.
#
# WHY WARMUP?
#   LoRA weights are randomly initialized. At step 0, the gradients
#   are essentially random noise. A high learning rate at this point
#   would make large, destructive random updates. Warmup starts with
#   tiny updates and gradually increases as the gradients become meaningful.
warmup_ratio: 0.03

# MAX SEQUENCE LENGTH: Maximum tokens per training example.
# Must match what you used in data_preparation.py!
#
# VRAM scales QUADRATICALLY with this (attention is O(n^2)):
#   512  → ~1x VRAM (good for most tasks) ← DEFAULT
#   1024 → ~4x VRAM (longer context tasks)
#   2048 → ~16x VRAM (long document tasks — needs big GPU)
max_seq_length: 512

# WEIGHT DECAY: L2 regularization strength.
# Shrinks weight magnitudes to prevent overfitting.
# Applied to all params EXCEPT biases and LayerNorm (those shouldn't decay).
#
# 0.00 = No regularization (large datasets)
# 0.01 = Light regularization ← DEFAULT
# 0.10 = Strong regularization (if overfitting badly)
weight_decay: 0.01

# OUTPUT DIRECTORY: Where to save checkpoints and final model.
# Checkpoints are saved according to save_strategy.
output_dir: "./outputs/lora_finetuned"

# LOGGING: Print training metrics every N steps.
# Lower = more frequent updates (useful for monitoring)
# Higher = less console noise
logging_steps: 10

# SAVE STRATEGY: When to save model checkpoints.
# "epoch" = save after each epoch (most common)
# "steps" = save every N steps (use with save_steps parameter)
# "no"    = don't save checkpoints (save manually)
save_strategy: "epoch"

# MIXED PRECISION: Use lower precision for faster training.
#
# Check your GPU:
#   - RTX 3000+, A100, L4, T4: Use bf16=true (most stable)
#   - RTX 2000, V100: Use fp16=true (bf16 not supported)
#   - CPU: Both false
#
# Never set both to true!
fp16: false
bf16: false

# RANDOM SEED: For reproducible experiments.
# Same seed + same data + same config = same results.
# Essential for scientific rigor and debugging.
seed: 42
